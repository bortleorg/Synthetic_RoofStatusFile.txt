name: Build EXE

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Test imports
        run: |
          cd src && python -c "
          import sys
          import warnings
          warnings.filterwarnings('ignore')
          
          print('Testing core imports...')
          import tkinter
          print('[OK] tkinter')
          
          import cv2
          print('[OK] opencv-python')
          
          import numpy
          print('[OK] numpy') 
          
          import sklearn.linear_model
          print('[OK] sklearn')
          
          import joblib
          print('[OK] joblib')
          
          import ephem
          print('[OK] ephem')
          
          import pytz
          print('[OK] pytz')
          
          try:
              import astropy.io.fits
              print('[OK] astropy')
          except ImportError as e:
              print(f'[WARN] astropy import issue: {e}')
          
          # Test ASCOM Alpaca dependencies
          try:
              import flask
              print('[OK] flask')
              import flask_cors
              print('[OK] flask_cors')
              print('[OK] ASCOM Alpaca dependencies available')
          except ImportError as e:
              print(f'[WARN] ASCOM Alpaca dependencies issue: {e}')
          
          print('All core imports successful!')
          "

      - name: Build EXE with pyinstaller
        run: |
          echo "Building with PyInstaller..."
          pyinstaller synthetic_roofstatus.spec --clean --noconfirm
          
          echo "Checking build output..."
          if (Test-Path "dist/Synthetic_RoofStatusFile.exe") {
            $fileInfo = Get-Item "dist/Synthetic_RoofStatusFile.exe"
            Write-Host "[SUCCESS] Build completed!"
            Write-Host "File size: $([math]::Round($fileInfo.Length / 1MB, 2)) MB"
            
            # Test the executable with a timeout (it's a GUI app so it won't exit on its own)
            echo "Testing executable runtime dependencies..."
            $proc = Start-Process -FilePath "dist/Synthetic_RoofStatusFile.exe" -PassThru
            $exited = $proc.WaitForExit(15000)
            if (-not $exited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              Write-Host "[SUCCESS] Executable launched successfully (GUI app terminated after timeout)"
            } elseif ($proc.ExitCode -eq 0) {
              Write-Host "[SUCCESS] Executable ran and exited cleanly"
            } else {
              Write-Host "[WARN] Executable exited with code: $($proc.ExitCode)"
            }
          } else {
            Write-Error "Build failed - executable not found"
            exit 1
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Synthetic_RoofStatusFile
          path: dist/Synthetic_RoofStatusFile.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/Synthetic_RoofStatusFile.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
